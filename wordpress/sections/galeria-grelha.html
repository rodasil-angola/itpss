<section class="rd-gal" aria-labelledby="rd-gal-titulo">
  <style>
    .rd-gal { padding: var(--rd-espaco-xl) 0 0; }
    .rd-gal__topo { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 36px; }
    .rd-gal__filtros { display: flex; flex-wrap: wrap; gap: 8px; }
    .rd-gal__filtros button { min-height: 42px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--rd-cor-linha); background: #fff; cursor: pointer; font-family: var(--rd-fonte-titulo); font-weight: 600; font-size: .86rem; color: var(--rd-azul-escuro); transition: background-color .25s, border-color .25s, color .25s; }
    .rd-gal__filtros button:hover { border-color: var(--rd-azul); color: var(--rd-azul); }
    .rd-gal__filtros button[aria-pressed="true"] { background: var(--rd-azul-escuro); border-color: var(--rd-azul-escuro); color: #fff; }
    .rd-gal__grelha { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: clamp(150px, 15vw, 210px); grid-auto-flow: dense; gap: 12px; }
    .rd-gal__item { border-radius: var(--rd-raio-borda); overflow: hidden; background: var(--rd-cor-fundo-alt); animation: rd-gal-in .5s var(--rd-ease); }
    .rd-gal__item--grande { grid-column: span 2; grid-row: span 2; }
    .rd-gal__item[hidden] { display: none; }
    @keyframes rd-gal-in { from { opacity: 0; transform: scale(.97); } }
    .rd-gal__item button { position: relative; display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .rd-gal__item img { width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--rd-ease), filter .5s; }
    .rd-gal__item button::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(18, 54, 90, .55)); opacity: 0; transition: opacity .4s; }
    .rd-gal__item button:hover img { transform: scale(1.06); }
    .rd-gal__item button:hover::after, .rd-gal__item button:focus-visible::after { opacity: 1; }
    .rd-gal__lupa { position: absolute; right: 14px; bottom: 14px; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--rd-azul-escuro); opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s var(--rd-ease); }
    .rd-gal__lupa .rd-icon { width: 18px; height: 18px; }
    .rd-gal__item button:hover .rd-gal__lupa, .rd-gal__item button:focus-visible .rd-gal__lupa { opacity: 1; transform: none; }
    .rd-gal__aviso { display: flex; gap: 10px; align-items: flex-start; margin-top: 24px; font-size: .85rem; color: var(--rd-cor-texto-claro); }
    .rd-gal__aviso .rd-icon { width: 18px; height: 18px; margin-top: 2px; }

    .rd-gal__lb { position: fixed; inset: 0; z-index: 200; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 64px 12px 24px; background: rgba(9, 25, 43, .94); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; }
    .rd-gal__lb.is-aberto { opacity: 1; visibility: visible; }
    .rd-gal__lb figure { margin: 0; display: grid; justify-items: center; gap: 14px; min-height: 0; height: 100%; align-content: center; }
    .rd-gal__lb img { max-width: 100%; max-height: calc(100vh - 150px); border-radius: var(--rd-raio-sm); box-shadow: 0 30px 60px rgba(0, 0, 0, .4); }
    .rd-gal__lb figcaption { color: rgba(255, 255, 255, .85); font-size: .92rem; text-align: center; }
    .rd-gal__lb button { display: grid; place-items: center; width: 50px; height: 50px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .06); color: #fff; cursor: pointer; transition: background-color .25s; justify-self: center; }
    .rd-gal__lb button:hover { background: rgba(255, 255, 255, .16); }
    .rd-gal__lb .rd-icon { width: 22px; height: 22px; }
    .rd-gal__lb-fechar { position: absolute; top: 14px; right: 14px; }
    body.rd-lb-aberto { overflow: hidden; }

    @media (max-width: 900px) { .rd-gal__grelha { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) {
      .rd-gal__grelha { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 140px; gap: 8px; }
      .rd-gal__lb { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; padding: 64px 12px 20px; }
      .rd-gal__lb figure { grid-column: 1 / -1; }
      .rd-gal__lb-ant, .rd-gal__lb-seg { grid-row: 2; }
    }
  </style>

  <script>
    (function () {
      var raiz = document.querySelector('.rd-gal');
      if (!raiz) return;
      var itens = Array.prototype.slice.call(raiz.querySelectorAll('.rd-gal__item'));
      var filtros = raiz.querySelectorAll('[data-filtro]');
      filtros.forEach(function (b) {
        b.addEventListener('click', function () {
          var f = b.getAttribute('data-filtro');
          filtros.forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          itens.forEach(function (it) { it.hidden = !(f === 'todas' || it.getAttribute('data-cat') === f); });
        });
      });

      var lb = raiz.querySelector('.rd-gal__lb');
      var img = lb.querySelector('img');
      var cap = lb.querySelector('figcaption');
      var actual = 0;
      var origem = null;
      function visiveis() { return itens.filter(function (it) { return !it.hidden; }); }
      function mostrar(i) {
        var lista = visiveis();
        actual = (i + lista.length) % lista.length;
        var b = lista[actual].querySelector('button');
        var t = lista[actual].querySelector('img').alt;
        img.src = b.getAttribute('data-full');
        img.alt = t;
        cap.textContent = t + ' (' + (actual + 1) + ' de ' + lista.length + ')';
      }
      function abrir(i) { origem = document.activeElement; mostrar(i); lb.classList.add('is-aberto'); document.body.classList.add('rd-lb-aberto'); lb.querySelector('.rd-gal__lb-fechar').focus(); }
      function fechar() { lb.classList.remove('is-aberto'); document.body.classList.remove('rd-lb-aberto'); if (origem) origem.focus(); }
      itens.forEach(function (it) {
        it.querySelector('button').addEventListener('click', function () { abrir(visiveis().indexOf(it)); });
      });
      lb.querySelector('.rd-gal__lb-fechar').addEventListener('click', fechar);
      lb.querySelector('.rd-gal__lb-ant').addEventListener('click', function () { mostrar(actual - 1); });
      lb.querySelector('.rd-gal__lb-seg').addEventListener('click', function () { mostrar(actual + 1); });
      lb.addEventListener('click', function (e) { if (e.target === lb || e.target.tagName === 'FIGURE') fechar(); });
      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('is-aberto')) return;
        if (e.key === 'Escape') fechar();
        if (e.key === 'ArrowLeft') mostrar(actual - 1);
        if (e.key === 'ArrowRight') mostrar(actual + 1);
      });
      var x0 = null;
      lb.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
      lb.addEventListener('touchend', function (e) {
        if (x0 === null) return;
        var dx = e.changedTouches[0].clientX - x0;
        if (Math.abs(dx) > 50) mostrar(actual + (dx < 0 ? 1 : -1));
        x0 = null;
      });
    })();
  </script>
